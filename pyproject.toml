[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cse-ai-platform"
version = "0.1.0"
description = "CSE Research & Agent Builder Platform"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0.0",
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-groq>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_builder*", "shared*", "research_agent*", "backend*"]
exclude = ["frontend*", "tests*", "*.tests*", ".venv*", "docs*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["agent_builder/tests", "tests"]
